services:
  db:
    image: postgres:16-alpine
    container_name: clefia128_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clefia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clefia_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-clefia_db}
    ports:
      - "5432:5432"
    volumes:
      - clefia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clefia} -d ${POSTGRES_DB:-clefia_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clefia_pgdata:
