[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clefia128-capstone"
version = "0.1.0"
description = "Pure-Python mathematical implementation of CLEFIA-128 with a FastAPI/PostgreSQL educational demonstrator and reproducible experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
experiments = [
    "matplotlib>=3.9.0",
    "numpy>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clefia", "src/web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
